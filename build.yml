name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Run tests
        run: make test

      - name: Build plug-in
        run: make

      - name: Store compiled files for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Vortex_stereo-${{ github.sha }}
          path: |
            plugins/vortex_stereo.o
            plugins/plugin.json

# This workflow deliberately does not create a GitHub Release or publish files.
# Release publication remains a manual decision by the repository owner.
